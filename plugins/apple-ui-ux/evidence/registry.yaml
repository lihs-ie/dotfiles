    title: Get to know the new design system
    source: https://developer.apple.com/videos/play/wwdc2025/356/
    retrieved_at: "2026-08-14"
    summary: Information architecture, content, controls, and navigation form an adaptive system across devices, sizes, and input modes.
    status: confirmed
  - identifier: EVD-WWDC25-LIQUID-GLASS
    level: L1
    source_kind: apple_wwdc
    title: Meet Liquid Glass
    source: https://developer.apple.com/videos/play/wwdc2025/219/
    retrieved_at: "2026-08-14"
