    source: https://developer.apple.com/videos/play/wwdc2025/323/
    retrieved_at: "2026-08-14"
    summary: SwiftUI structural components and controls adopt the new system design; custom Liquid Glass should be limited to justified custom elements.
    status: confirmed
  - identifier: EVD-WWDC25-UIKIT-DESIGN
    level: L2
    source_kind: apple_wwdc
    title: Build a UIKit app with the new design
    source: https://developer.apple.com/videos/play/wwdc2025/284/
    retrieved_at: "2026-08-14"
    summary: UIKit navigation, split, tab, toolbar, and control components adopt the system design and should replace unnecessary custom equivalents.
    status: confirmed
  - identifier: EVD-WWDC25-IPAD
    level: L1
    source_kind: apple_wwdc
    title: Elevate the design of your iPad app
    source: https://developer.apple.com/videos/play/wwdc2025/208/
    retrieved_at: "2026-08-14"
