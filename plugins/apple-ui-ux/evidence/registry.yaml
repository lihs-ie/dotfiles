evidence:
  - identifier: EVD-HIG-ACCESSIBILITY
    level: L1
    source_kind: apple_hig
    title: Accessibility
    source: https://developer.apple.com/design/human-interface-guidelines/accessibility
    retrieved_at: "2026-08-14"
    summary: Interfaces should be perceivable, adaptable, operable with assistive technologies, and not rely on one presentation or interaction channel.
    status: confirmed
  - identifier: EVD-HIG-BUTTONS
    level: L1
    source_kind: apple_hig
    title: Buttons
    source: https://developer.apple.com/design/human-interface-guidelines/buttons
    retrieved_at: "2026-08-14"
    summary: System buttons provide built-in states and adaptation; actionable hit regions should generally be at least 44 by 44 points.
    status: confirmed
  - identifier: EVD-HIG-COLOR
    level: L1
    source_kind: apple_hig
    title: Color
    source: https://developer.apple.com/design/human-interface-guidelines/color
    retrieved_at: "2026-08-14"
    summary: Use color by semantic role and preserve meaning across appearance and accessibility settings.
    status: confirmed
  - identifier: EVD-HIG-MOTION
    level: L1
    source_kind: apple_hig
    title: Motion
    source: https://developer.apple.com/design/human-interface-guidelines/motion
    retrieved_at: "2026-08-14"
    summary: Custom motion should remain understandable and accommodate system accessibility preferences.
    status: confirmed
  - identifier: EVD-HIG-POINTING
    level: L1
    source_kind: apple_hig
    title: Pointing devices
    source: https://developer.apple.com/design/human-interface-guidelines/pointing-devices
    retrieved_at: "2026-08-14"
    summary: On iPad a pointing device is an additional interaction method and does not replace touch or gestures.
    status: confirmed
  - identifier: EVD-HIG-PENCIL
    level: L1
    source_kind: apple_hig
    title: Apple Pencil and Scribble
    source: https://developer.apple.com/design/human-interface-guidelines/apple-pencil-and-scribble
    retrieved_at: "2026-08-14"
    summary: Pencil-specific capabilities should respect user configuration and coexist with other input methods.
    status: confirmed
  - identifier: EVD-HIG-PRIVACY
    level: L1
    source_kind: apple_hig
    title: Privacy
    source: https://developer.apple.com/design/human-interface-guidelines/privacy
    retrieved_at: "2026-08-14"
    summary: Request protected resources in a context where the reason and user intent are clear.
    status: confirmed
  - identifier: EVD-HIG-ALERTS
    level: L1
    source_kind: apple_hig
    title: Alerts
    source: https://developer.apple.com/design/human-interface-guidelines/alerts
    retrieved_at: "2026-08-14"
    summary: Alerts and confirmation flows should communicate consequences and preserve a safe cancellation path.
    status: confirmed
  - identifier: EVD-WWDC24-DYNAMIC-TYPE
    level: L1
