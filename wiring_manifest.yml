# wiring_manifest.yml — dotfiles (config/docs repo) の配線追随宣言。
# scripts/verify-wiring.sh が読む。コードの runtime 結線ではなく、
# 「skill ↔ agent ↔ template ↔ 正本」の参照整合 (meta-wiring) を co-change で守る。
# schema: rules[].{ id, when(glob), require_one_of[](glob), reason, smoke? }
# glob: ** = 任意階層, * = 同一階層。配線不要な変更は
# .agent-evidence/wiring-waivers.txt に rule id を 1 行書いて理由を証跡化する。
rules:
  - id: agent-referenced-by-orchestrator
    when: "dot_claude/agents/*.md"
    require_one_of:
      - "dot_claude/skills/proven-done/SKILL.md"
      - "dot_claude/skills/self-improve/SKILL.md"
      - "dot_claude/docs/agent-policy.md"
    reason: "新規/改名した agent は orchestrator skill か正本から参照されないと orphan (どの段からも起動されない) になる。"
    smoke: "grep -RnoE '(spec-curator|topology-mapper|implementer|static-verifier|runtime-verifier|spec-grader|done-evaluator|failure-miner|harness-maintainer)' dot_claude/skills/*/SKILL.md"

  - id: kit-template-registered-in-skill
    when: "dot_claude/skills/agent-policy-kit/templates/**"
    require_one_of:
      - "dot_claude/skills/agent-policy-kit/SKILL.md"
    reason: "kit の新規テンプレは SKILL.md の Apply 手順に載らないと、対象 repo へ scaffold されない (dead template)。"

  - id: policy-propagates-to-generated
    when: "dot_claude/docs/agent-policy.md"
    require_one_of:
      - "dot_claude/skills/agent-policy-kit/templates/AGENTS.md.tmpl.literal"
      - "dot_claude/skills/agent-policy-kit/templates/CLAUDE.md.section.tmpl.literal"
      - "dot_claude/skills/proven-done/SKILL.md"
      - "dot_claude/skills/agent-policy-kit/SKILL.md"
    reason: "正本 (single source of truth) を変えたら、そこから生成される AGENTS テンプレや、参照する orchestrator にも追随が要る。"

  - id: rubric-pack-listed-in-kit
    when: "dot_claude/skills/agent-policy-kit/templates/rubric/packs/*.md"
    require_one_of:
      - "dot_claude/skills/agent-policy-kit/SKILL.md"
      - "dot_claude/skills/agent-policy-kit/scripts/executable_detect-langs.sh"
    reason: "stack pack は言語検出 (detect-langs) と Apply 手順に結線されないと opt-in 展開されない。"

  - id: quarantine-referenced-in-verify
    when: "ci/quarantine.yml"
    require_one_of:
      - "scripts/verify-allowlist-expiry.sh"
      - "dot_claude/skills/agent-policy-kit/templates/scripts/executable_verify-allowlist-expiry.sh"
    reason: "quarantine.yml は verify-allowlist-expiry.sh --quarantine で期限切れチェックされないと dead registry になる。"

  - id: formal-harness-registered-in-skill
    when: "dot_claude/skills/z3-tla-playbook/scripts/**"
    require_one_of:
      - "dot_claude/skills/z3-tla-playbook/SKILL.md"
      - "tests/z3-tla-playbook-tests.sh"
    reason: "ハーネス (setup-env/run-checks) の挙動を変えたら、SKILL.md の手順か契約テストのどちらかが追随しないと、実行経路と文書・検査が乖離する。"

  - id: formal-template-registered-in-skill
    when: "dot_claude/skills/z3-tla-playbook/templates/**"
    require_one_of:
      - "dot_claude/skills/z3-tla-playbook/SKILL.md"
      - "dot_claude/skills/z3-tla-playbook/scripts/executable_setup-env.sh"
    reason: "新規テンプレは setup-env.sh --init の配置リストか SKILL.md のファイル構成に載らないと、どこからも展開されない dead template になる。"

  - id: apple-ui-ux-skills-wired-to-shared-contracts
    when: "plugins/apple-ui-ux/skills/**"
    require_one_of:
      - "plugins/apple-ui-ux/references/workflow-contract.md"
      - "plugins/apple-ui-ux/open-design.json"
      - "plugins/apple-ui-ux/tests/test-foundation.sh"
    reason: "生成・適合 Skill は共通のprofile、rule、approval lifecycleから到達できなければ、hostごとに設計判断と人間ゲートが分岐する。"
    smoke: "bash plugins/apple-ui-ux/tests/test-foundation.sh"

  - id: apple-ui-ux-contracts-wired-to-verifier
    when: "plugins/apple-ui-ux/**"
    require_one_of:
      - "plugins/apple-ui-ux/skills/generate-apple-ui/SKILL.md"
      - "plugins/apple-ui-ux/skills/conform-apple-ui/SKILL.md"
      - "plugins/apple-ui-ux/tests/test-foundation.sh"
    reason: "Rule/Evidence/Profile/Schema/approval gateは、公開Skillと決定論的contract testのどちらからも参照されないdead resourceにしない。"
    smoke: "python3 plugins/apple-ui-ux/scripts/approval_gate.py validate-foundation"

  - id: iterations-schema-in-skill
    when: "dot_claude/agents/implementer.md"
    require_one_of:
      - "dot_claude/skills/proven-done/SKILL.md"
      - "dot_claude/docs/agent-policy.md"
    reason: "iterations.json スキーマが implementer に追加されたら proven-done SKILL.md か正本から参照される必要がある。"
